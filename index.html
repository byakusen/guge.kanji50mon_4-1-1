<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>漢字50問テスト</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Klee+One:wght@600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
<style>
/* 1画面完結：上にヘッダー、まん中に問題パネル、下に操作ボタン。すりガラスのパネルをグラデーションの上に置く */
:root{
  --ink:#22304a;
  --sub:#56657f;
  --glass:rgba(255,255,255,.58);
  --glass-strong:rgba(255,255,255,.82);
  --edge:rgba(255,255,255,.85);
  --shadow:0 10px 30px rgba(40,60,100,.16);
  --red:#e03e36;      /* 赤ペン */
  --write:#e2574c;    /* 書きモード */
  --read:#2e6fd6;     /* 読みモード */
  --okuri:#14936a;    /* 送りがなモード */
  --ok:#14936a;
  --ng:#d63a3a;
  --round:'M PLUS Rounded 1c','Hiragino Maru Gothic ProN','Meiryo',sans-serif;
  --brush:'Klee One','UD Digi Kyokasho N-R','YuKyokasho','Yu Mincho',serif;
  color-scheme:light;
}
html,body{height:100%}
body{
  margin:0;font-family:var(--round);color:var(--ink);
  background-color:#ffe2b8;
  background-image:linear-gradient(135deg,#ffe2b8 0%,#ffd0dc 34%,#cdf1e2 68%,#bcdcff 100%);
  overflow:hidden;
  display:flex;justify-content:center;align-items:center;
  box-sizing:border-box;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font-family:inherit;color:inherit}
#app{width:100%;max-width:980px;height:100%;padding-block:12px;display:flex;flex-direction:column;min-height:0}
.screen{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.6)}70%{transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.glass{
  background:var(--glass);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border:1px solid var(--edge);border-radius:22px;box-shadow:var(--shadow);
}
.btn{
  border:none;border-radius:14px;padding:.7em 1.2em;font-size:clamp(15px,2.4vh,20px);font-weight:800;
  background:var(--glass-strong);box-shadow:0 4px 12px rgba(40,60,100,.14);cursor:pointer;
  transition:transform .15s,box-shadow .15s,background .15s,opacity .15s;
}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(40,60,100,.2)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible,.opt:focus-visible,.chk:focus-within{outline:3px solid #1d4fa8;outline-offset:2px}
.btn:disabled{opacity:.35;cursor:default;transform:none;box-shadow:none}
.btn.main{color:#fff;background:var(--mc,#2e6fd6)}

/* ---------- ホーム ---------- */
.home{justify-content:center;align-items:center}
.home h1{margin:0;font-size:clamp(28px,6vh,52px);font-weight:800;letter-spacing:.06em;text-align:center}
.home .lead{margin:0;color:var(--sub);font-size:clamp(14px,2.2vh,18px);text-align:center}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;width:100%;margin-top:6px}
.mode{display:flex;flex-direction:column;gap:8px;padding:18px;align-items:flex-start}
.mode .tag{font-size:13px;font-weight:800;color:#fff;background:var(--mc);border-radius:999px;padding:.2em .8em;letter-spacing:.08em}
.mode h2{margin:0;font-size:clamp(20px,3.4vh,28px)}
.mode .sample{font-family:var(--brush);font-size:clamp(18px,3vh,26px);color:var(--sub);line-height:1.4}
.mode .sample u{text-decoration-color:var(--red);text-decoration-thickness:3px;text-underline-offset:4px}
.mode .sample .bx{display:inline-block;width:1em;height:1em;border:2px solid var(--sub);vertical-align:-.1em;margin:0 1px}
.mode .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;width:100%}
.mode .row .btn{flex:1;white-space:nowrap}
.mode .retry{font-size:clamp(13px,2vh,16px);color:var(--mc);background:#fff}

/* ---------- 問題画面のヘッダー ---------- */
.bar{display:flex;align-items:center;gap:10px;padding:8px 10px}
.bar .home-btn{padding:.45em .9em;font-size:clamp(13px,2vh,16px)}
.bar .mname{font-weight:800;font-size:clamp(15px,2.5vh,20px);color:var(--mc);white-space:nowrap}
.bar .retry-mark{font-size:12px;font-weight:800;color:#fff;background:var(--ng);border-radius:999px;padding:.15em .7em;white-space:nowrap}
.prog{flex:1;height:10px;border-radius:99px;background:rgba(255,255,255,.7);overflow:hidden;min-width:40px}
.prog i{display:block;height:100%;background:var(--mc);border-radius:99px;transition:width .3s}
.count{font-weight:800;font-size:clamp(15px,2.5vh,20px);font-variant-numeric:tabular-nums;white-space:nowrap}

.panel{flex:1;min-height:0;position:relative;display:flex;padding:clamp(12px,2.5vh,26px)}

.foot{display:flex;gap:10px;justify-content:space-between}
.foot .btn{flex:1;max-width:240px;padding:.75em .6em}
.foot .btn.main{flex:1.4;max-width:320px}

/* ---------- ① 書き ---------- */
.wgrid{flex:1;min-height:0;display:grid;grid-template-columns:auto auto;justify-content:center;gap:clamp(14px,3vw,36px);column-gap:clamp(32px,5vw,80px);align-items:center}
.clues{list-style:none;margin:0;padding:0 0 0 6px;display:flex;flex-direction:column;gap:clamp(14px,4.2vh,42px);font-size:clamp(20px,min(6vh,4.6vw),50px);width:11em}
.clues li{font-size:1em;font-weight:700;line-height:1.9;display:flex;gap:.5em;align-items:baseline}
.clues li::before{content:attr(data-n);font-size:.55em;color:#fff;background:var(--write);border-radius:50%;width:1.6em;height:1.6em;display:inline-grid;place-items:center;flex:none;transform:translateY(-.26em);padding-bottom:.22em}
.clues li ruby.bk{ruby-position:over}
.clues li ruby.bk rt{font-size:.5em;font-weight:800;color:var(--ink);line-height:1;padding-bottom:.25em}
.blank{display:inline-block;width:1.05em;height:1.05em;border:3px solid var(--ink);border-radius:4px;vertical-align:-.15em;margin:0 .06em;background:rgba(255,255,255,.7);position:relative;overflow:hidden}
.blank.on{border-color:var(--red);background:#fff}
.blank.on::after{content:attr(data-k);position:absolute;inset:0;display:grid;place-items:center;font-family:var(--brush);color:var(--red);font-size:.9em;line-height:1;animation:pop .35s ease}
/* □の中の字は、書き順と同じ線のデータでかく（字の上下のずれが出ない） */
.blank.svg::after{content:none}
.blank svg{position:absolute;inset:0;width:100%;height:100%;animation:pop .35s ease}
.blank path{fill:none;stroke:var(--red);stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
.wans{display:flex;flex-direction:column;align-items:center;gap:clamp(8px,1.8vh,16px)}
.bigbox{
  --s:min(42vh,32vw,300px);
  width:var(--s);height:var(--s);border:4px solid var(--ink);border-radius:10px;background:#fff;position:relative;
  display:grid;place-items:center;
  background-image:
    linear-gradient(to right,transparent calc(50% - 1px),rgba(34,48,74,.22) calc(50% - 1px),rgba(34,48,74,.22) calc(50% + 1px),transparent calc(50% + 1px)),
    linear-gradient(to bottom,transparent calc(50% - 1px),rgba(34,48,74,.22) calc(50% - 1px),rgba(34,48,74,.22) calc(50% + 1px),transparent calc(50% + 1px));
}
.bigbox span{font-family:var(--brush);font-size:calc(var(--s)*.78);line-height:1;color:var(--red);animation:pop .4s ease}
/* 書き順アニメーション */
.kanim{position:absolute;inset:0;display:grid;place-items:center}
.kanim svg{width:94%;height:94%}
.kanim path{fill:none;stroke:var(--red);stroke-width:5.5;stroke-linecap:round;stroke-linejoin:round}
.wrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center}
.replay{padding:.45em .9em;font-size:clamp(14px,2.2vh,18px)}
.kcount{font-weight:800;color:var(--red);font-size:clamp(15px,2.4vh,20px);font-variant-numeric:tabular-nums;min-width:4.8em;text-align:center}
.credit{margin:0;font-size:11px;color:var(--sub)}

/* チェック（書けた・読めた） */
.chk{display:inline-flex;align-items:center;gap:.5em;font-size:clamp(18px,3vh,26px);font-weight:800;cursor:pointer;user-select:none;
  background:#fff;border-radius:16px;padding:.35em .9em .35em .5em;box-shadow:0 4px 12px rgba(40,60,100,.14);animation:pop .35s ease}
.chk input{position:absolute;opacity:0;width:1px;height:1px}
.chk .sq{width:1.5em;height:1.5em;border:3px solid var(--sub);border-radius:8px;display:grid;place-items:center;transition:background .15s,border-color .15s}
.chk .sq svg{width:1.1em;height:1.1em;opacity:0;transition:opacity .15s}
.chk input:checked + .sq{background:var(--ok);border-color:var(--ok)}
.chk input:checked + .sq svg{opacity:1}
.wbelow{position:relative;display:flex;flex-direction:column;align-items:center;gap:clamp(8px,1.8vh,16px)}
.wbelow.wait .wrow,.wbelow.wait .chk{visibility:hidden;animation:none}
.wbelow .chk-wait{position:absolute;inset:0;justify-content:center}
.chk-wait{font-size:clamp(14px,2.2vh,18px);color:var(--sub);min-height:2.6em;display:flex;align-items:center;text-align:center}

/* ---------- ② 読み ---------- */
.rwrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(10px,3vh,30px)}
.word{display:flex;align-items:flex-end;font-family:var(--brush);font-size:clamp(56px,min(17vh,15vw),150px);line-height:1}
.col{display:flex;flex-direction:column;align-items:center}
.col .rt{font-family:var(--round);font-size:.3em;font-weight:800;height:1.3em;line-height:1.3em;white-space:nowrap;margin-bottom:.15em;color:var(--ink)}
.col .rt .yomi{color:var(--red);animation:fade .3s ease;display:inline-block;min-width:2.2em;text-align:center}
.col .rt .sp{display:inline-block;min-width:2.2em}
/* （ ）の読みが漢字より長くても、字の間を広げない（答えを出しても言葉が横に動かない） */
.col.tg .rt{width:0;display:flex;justify-content:center}
.col.tg .rt .yomi,.col.tg .rt .sp{flex:none}
.col.tg .ch{text-decoration:underline;text-decoration-color:var(--red);text-decoration-thickness:.06em;text-underline-offset:.12em}
.rbtns{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center;min-height:3.2em}
.say{display:inline-flex;align-items:center;gap:.4em}
.say svg{width:1.2em;height:1.2em}
.rnote{color:var(--sub);font-size:clamp(14px,2.2vh,18px);margin:0}

/* ---------- ③ 送りがな ---------- */
.owrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(12px,3.5vh,34px)}
.osent{font-size:clamp(26px,min(7vh,6.4vw),58px);font-weight:700;text-align:center;line-height:1.4}
.osent b{color:var(--okuri);border-bottom:4px solid var(--okuri);padding:0 .1em}
.opts{display:flex;gap:clamp(10px,2vw,22px);flex-wrap:wrap;justify-content:center}
.opt{
  font-family:var(--brush);font-size:clamp(30px,min(8vh,7vw),64px);min-width:3.4em;padding:.25em .6em;border-radius:18px;border:3px solid transparent;
  background:#fff;box-shadow:0 6px 16px rgba(40,60,100,.15);cursor:pointer;transition:transform .15s,box-shadow .15s,border-color .15s,background .15s;position:relative
}
.opt:hover:not(:disabled){transform:translateY(-3px);box-shadow:0 10px 22px rgba(40,60,100,.2)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:#e6f7ef}
.opt.wrong{border-color:var(--ng);background:#fdeaea}
.opt.dim{opacity:.45}
.mark{position:absolute;top:-.55em;right:-.4em;font-family:var(--round);font-size:.5em;font-weight:800;color:#fff;width:1.6em;height:1.6em;border-radius:50%;display:grid;place-items:center;animation:pop .3s ease}
.right .mark{background:var(--ok)}
.wrong .mark{background:var(--ng)}
.ofb{min-height:1.6em;font-size:clamp(18px,3vh,26px);font-weight:800;margin:0}
.ofb.ok{color:var(--ok)}
.ofb.ng{color:var(--ng)}

/* ---------- 結果 ---------- */
.result{justify-content:center;align-items:center}
.rcard{width:100%;max-width:720px;display:flex;flex-direction:column;align-items:center;gap:clamp(8px,2vh,16px);padding:clamp(16px,4vh,36px)}
.rcard .rm{font-weight:800;color:var(--mc);font-size:clamp(16px,2.6vh,22px)}
.score{font-size:clamp(48px,12vh,104px);font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.score small{font-size:.38em;color:var(--sub)}
.msg{margin:0;font-size:clamp(17px,2.8vh,24px);font-weight:700;text-align:center}
.misslist{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-height:22vh;overflow:auto;padding:4px}
.misslist span{font-family:var(--brush);font-size:clamp(18px,3vh,26px);background:#fff;border:2px solid var(--ng);color:var(--ng);border-radius:10px;padding:0 .4em}
.rbtnrow{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;width:100%}
.rbtnrow .btn{flex:1;min-width:160px;max-width:260px}

/* ---------- リセット・おめでとう・確認 ---------- */
.bar .reset-btn{padding:.45em .9em;font-size:clamp(13px,2vh,16px);color:var(--ng);background:#fff;white-space:nowrap}
.mode .left{font-size:clamp(13px,2vh,16px);font-weight:800;color:var(--mc)}
.congrats{justify-content:center;align-items:center}
.ccard{width:100%;max-width:720px;display:flex;flex-direction:column;align-items:center;gap:clamp(10px,2.4vh,20px);padding:clamp(20px,5vh,44px);text-align:center}
.ccard .rm{font-weight:800;color:var(--mc);font-size:clamp(16px,2.6vh,22px)}
.ccard h2{margin:0;font-size:clamp(34px,min(11vh,12vw),96px);white-space:nowrap;font-weight:800;color:var(--mc);letter-spacing:.06em;animation:pop .5s ease}
.ccard .cmsg{margin:0;font-size:clamp(17px,2.8vh,24px);font-weight:700}
.dlg{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:rgba(34,48,74,.35);animation:fade .2s ease}
.dbox{width:100%;max-width:440px;display:flex;flex-direction:column;gap:14px;padding:clamp(18px,4vh,28px);background:var(--glass-strong)}
.dbox h3{margin:0;font-size:clamp(19px,3vh,24px);color:var(--ng)}
.dbox p{margin:0;font-size:clamp(15px,2.3vh,18px);line-height:1.7}
.dbtns{display:flex;gap:10px;justify-content:flex-end}
.dbtns .btn{flex:1;max-width:180px;white-space:nowrap;padding-inline:.6em}
.btn.danger{color:#fff;background:var(--ng)}

/* ---------- スマホ ---------- */
@media (max-width:720px){
  #app{padding-block:8px}
  .home h1{font-size:clamp(24px,8.5vw,40px)}
  .modes{grid-template-columns:1fr;gap:10px}
  .mode{padding:12px 14px;gap:4px}
  .mode .sample{display:none}
  .wgrid{grid-template-columns:1fr;grid-template-rows:auto 1fr;gap:10px;align-items:start}
  .clues{gap:8px;padding-top:18px}
  .clues{font-size:clamp(18px,4.2vh,30px);width:min(11.5em,100%);justify-self:center}
  .bigbox{--s:min(30vh,58vw,240px)}
  .wans{align-self:center}
  .foot .btn{font-size:15px;padding:.7em .3em}
  .bar{gap:6px;padding:6px 8px}
  .bar .mname{display:none}
  .bar .home-btn,.bar .reset-btn{padding:.45em .6em;white-space:nowrap}
  .bar .retry-mark{display:none}
}
@media (max-height:520px){
  .home .lead{display:none}
  .mode .sample{display:none}
}
</style>

</head>
<body>
<div id="app">
  <!-- ホーム -->
  <section class="screen home" id="home">
    <h1>漢字50問テスト</h1>
    <p class="lead">4年生で習う漢字。ノートに書いてから「こたえを見る」をおそう。</p>
    <div class="modes" id="modes"></div>
    <p class="credit">書き順データ：KanjiVG（Ulrich Apel, CC BY-SA 3.0）</p>
  </section>

  <!-- 問題 -->
  <section class="screen" id="quiz" hidden>
    <div class="bar glass">
      <button class="btn home-btn" id="toHome" type="button">モードをえらぶ</button>
      <span class="mname" id="mname"></span>
      <span class="retry-mark" id="retryMark" hidden>まちがえた問題</span>
      <div class="prog"><i id="progBar"></i></div>
      <span class="count" id="count"></span>
      <button class="btn reset-btn" id="reset" type="button">リセット</button>
    </div>
    <div class="panel glass" id="panel"></div>
    <div class="foot">
      <button class="btn" id="prev" type="button">◀ まえ</button>
      <button class="btn main" id="check" type="button">こたえを見る</button>
      <button class="btn" id="next" type="button">つぎ ▶</button>
    </div>
  </section>

  <!-- 結果 -->
  <section class="screen result" id="result" hidden>
    <div class="rcard glass">
      <div class="rm" id="rMode"></div>
      <div class="score" id="rScore"></div>
      <p class="msg" id="rMsg"></p>
      <div class="misslist" id="rMiss"></div>
      <div class="rbtnrow">
        <button class="btn main" id="rRetry" type="button">まちがえた問題だけ</button>
        <button class="btn" id="rAgain" type="button">もう一度ぜんぶ</button>
        <button class="btn" id="rHome" type="button">モードをえらぶ</button>
      </div>
    </div>
  </section>

  <!-- おめでとう（全問チェック） -->
  <section class="screen congrats" id="congrats" hidden>
    <div class="ccard glass">
      <div class="rm" id="cMode"></div>
      <h2>おめでとう！</h2>
      <p class="cmsg" id="cMsg"></p>
      <div class="rbtnrow">
        <button class="btn" id="cReset" type="button">リセット</button>
        <button class="btn main" id="cHome" type="button">モードをえらぶ</button>
      </div>
    </div>
  </section>
</div>

<!-- リセットの確認 -->
<div class="dlg" id="dlg" hidden>
  <div class="dbox glass" role="dialog" aria-modal="true" aria-labelledby="dTitle">
    <h3 id="dTitle">リセットしますか？</h3>
    <p id="dMsg"></p>
    <div class="dbtns">
      <button class="btn" id="dCancel" type="button">キャンセル</button>
      <button class="btn danger" id="dOk" type="button">OK</button>
    </div>
  </div>
</div>

<script>
/* =========================================================
   問題データ（ここを書きかえれば問題を変えられます）
   ========================================================= */

/* ① 書き：k＝答えの漢字、c＝問題（□が答えの場所）。2〜3文 */
const WRITE = [
  {k:'努',c:['□{ど}力する','□{ど}力家','勉強に□{つと}める']},
  {k:'巣',c:['鳥の□{す}','ハチの□{す}','□{す}箱をかける']},
  {k:'典',c:['百科事□{てん}','国語辞□{てん}','式□{てん}に出る']},
  {k:'果',c:['□{か}実をとる','試合の結□{か}','成□{か}を出す']},
  {k:'器',c:['食□{き}をあらう','楽□{き}をえんそうする','□{うつわ}にもる']},
  {k:'類',c:['分□{るい}する','人□{るい}','親□{るい}の家']},
  {k:'好',c:['大□{こう}物','□{す}きな色','□{この}みの味']},
  {k:'成',c:['漢字の□{な}り立ち','□{せい}長する','作品が完□{せい}する']},
  {k:'芽',c:['草の□{め}','たねから□{め}が出る','新□{め}がのびる']},
  {k:'量',c:['水の□{りょう}','雨□{りょう}','分□{りょう}をはかる']},
  {k:'辞',c:['国語□{じ}典','□{じ}書を引く','□{じ}表を出す']},

   ========================================================= */
let AC=null;
function ac(){
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended')AC.resume();
  }catch(e){AC=null}
  return AC;
}
function tone(f,start,dur,type,vol){
  const c=ac();if(!c)return;
  const o=c.createOscillator(),g=c.createGain(),t=c.currentTime+start;
  o.type=type;o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(vol,t+0.015);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g).connect(c.destination);o.start(t);o.stop(t+dur+0.05);
}
function pinpon(){tone(1319,0,.55,'sine',.35);tone(1047,.22,.9,'sine',.35)}
function bubuu(){tone(150,0,.28,'square',.12);tone(150,.34,.45,'square',.12)}

let JA_VOICE=null;
function pickVoice(){
  try{
    const vs=speechSynthesis.getVoices();
    JA_VOICE=vs.find(v=>/^ja/i.test(v.lang)&&/Google|Kyoko|Otoya|Nanami|Haruka/i.test(v.name))||vs.find(v=>/^ja/i.test(v.lang))||null;
  }catch(e){}
}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function speak(text,rate){
  if(!('speechSynthesis' in window))return;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang='ja-JP';u.rate=rate||.85;u.pitch=1;
    if(JA_VOICE)u.voice=JA_VOICE;
    speechSynthesis.speak(u);
  }catch(e){}
}
/* 読みの音声：ひらがなのままだと読みまちがえる声があるので、次の言葉は漢字の言葉を読ませる
   ・小さい字（ゃゅょっ）が入る言葉（「がっしょう」→「がつしよう」）
   ・「ん」のあとに あいうえお・やゆよ が続く言葉（「たんい」→「たに」）
   v を書いた問題は、v をそのまま読ませる（例：単位は「たん い」と少し間をあける）。vr を書いた問題は、その速さで読ませる（ふつうは .85） */
function sayText(q){if(q.v)return q.v;return /[ゃゅょっャュョッ]|ん[あいうえおやゆよ]/.test(q.s)?q.w:q.s}

/* ---------- 問題の進め方 ---------- */
let S=null;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function start(mode,indices){
  const m=MODES[mode];
  /* チェック済みの問題はのぞいて、ランダムな順に出す */
  indices=(indices||[]).filter(i=>!isDone(mode,i));
  const list=shuffle(indices.length?indices:remaining(mode));
  if(!list.length){congrats(mode);return}
  S={mode,list,pos:0,retry:!!indices.length,open:{},ok:{},picked:{},order:{}};
  if(mode==='okuri')list.forEach(i=>S.order[i]=shuffle(m.data[i].o));
  document.documentElement.style.setProperty('--mc',m.color);
  $('mname').textContent=m.name;
  $('retryMark').hidden=!S.retry;
  show('quiz');
  render();
}

function render(){
  const m=MODES[S.mode],idx=S.list[S.pos],q=m.data[idx],n=S.list.length;
  $('count').textContent=`${S.pos+1} / ${n}`;
  $('progBar').style.width=((S.pos+1)/n*100)+'%';
  $('prev').disabled=S.pos===0;
  $('next').textContent='つぎ ▶';
  const panel=$('panel');

  if(S.mode==='write'){
    const open=!!S.open[idx];
    const clues=q.c.map((c,j)=>`<li data-n="${j+1}"><span>${esc(c).replace(/□\{(.+?)\}/g,(_,y)=>`<ruby class="bk"><span class="blank${open?' on':''}" data-k="${q.k}"></span><rt>${y}</rt></ruby>`)}</span></li>`).join('');
    panel.innerHTML=`<div class="wgrid">
      <ul class="clues">${clues}</ul>
      <div class="wans">
        <div class="bigbox" aria-label="答えのわく">${open?'<div class="kanim" id="kanim"></div>':''}</div>
        <div class="wbelow${open?'':' wait'}"><div class="wrow"><span class="kcount" id="kcount"></span><button class="btn replay" type="button" id="replay">もう一度、書く</button></div>${chk('書けた！',idx)}${open?'':'<div class="chk-wait">ノートに書いたら<br>「こたえを見る」</div>'}</div>
      </div></div>`;
    $('check').hidden=false;$('check').disabled=open;
    if(open){drawStrokes(q.k);fillBlanks(q.k);$('replay').onclick=()=>drawStrokes(q.k)}
    else{ANIM++;loadStrokes(q.k)}
  }

  if(S.mode==='read'){
    const open=!!S.open[idx];
    /* 答える字（i から n 字）は1つにまとめて、その上に（ ）を出す */
    const ws=[...q.w],tn=q.n||1;
    const cells=[];
    for(let j=0;j<ws.length;){
      if(j===q.i){cells.push({ch:ws.slice(j,j+tn).join(''),tg:true});j+=tn}
      else{cells.push({ch:ws[j],tg:false});j++}
    }
    const chars=cells.map(({ch,tg})=>{
      const rt=tg?(open?`（<span class="yomi">${q.r}</span>）`:'（<span class="sp"></span>）'):'';
      return `<div class="col${tg?' tg':''}"><div class="rt">${rt}</div><div class="ch">${ch}</div></div>`;
    }).join('');
    panel.innerHTML=`<div class="rwrap">
      <div class="word" aria-label="${esc(q.w)}">${chars}</div>
      <div class="rbtns">
        ${open?`<button class="btn say" type="button" id="say">${SPEAK_SVG}もう一度きく</button>${chk('読めた！',idx)}`
              :'<p class="rnote">線の字の読みを（ ）に書こう</p>'}
      </div></div>`;
    if(open)$('say').onclick=()=>speak(sayText(q),q.vr);
    $('check').hidden=false;$('check').disabled=open;
  }

  if(S.mode==='okuri'){
    const picked=S.picked[idx];
    const sent=esc(q.s).replace(/【(.+?)】/,'<b>$1</b>');
    const right=q.o[0];
    const opts=S.order[idx].map(o=>{
      let cls='',mk='';
      if(picked!==undefined){
        if(o===right){cls='right';mk='<span class="mark">○</span>'}
        else if(o===picked){cls='wrong';mk='<span class="mark">×</span>'}
        else cls='dim';
      }
      return `<button class="opt ${cls}" type="button" data-o="${esc(o)}" ${picked!==undefined?'disabled':''}>${esc(o)}${mk}</button>`;
    }).join('');
    let fb='';
    if(picked!==undefined)fb=picked===right?'<p class="ofb ok">せいかい！</p>':`<p class="ofb ng">正しくは「${esc(right)}」</p>`;
    else fb='<p class="ofb" style="color:var(--sub)">正しい送りがなをえらぼう</p>';
    panel.innerHTML=`<div class="owrap">
      <div class="osent">${sent}</div>
      <div class="opts" id="opts">${opts}</div>${fb}</div>`;
    $('check').hidden=true;
  }
}

/* 書き順（KanjiVG のデータをネットから読みこむ。読みこめないときは字を表示） */
const KVG={};
let ANIM=0;
function loadStrokes(k){
  if(!KVG[k]){
    const url='https://cdn.jsdelivr.net/gh/KanjiVG/kanjivg@master/kanji/'+k.codePointAt(0).toString(16).padStart(5,'0')+'.svg';
    KVG[k]=fetch(url).then(r=>{if(!r.ok)throw new Error('load');return r.text()}).then(t=>{
      const d=new DOMParser().parseFromString(t,'image/svg+xml');
      const ps=[...d.querySelectorAll('path')].filter(p=>/-s\d+$/.test(p.getAttribute('id')||'')).map(p=>p.getAttribute('d'));
      if(!ps.length)throw new Error('empty');
      return ps;
    }).catch(()=>null);
  }
  return KVG[k];
}
/* □の中に答えの字をかく（線のデータが読みこめないときは、ふつうの字のまま） */
function fillBlanks(k){
  loadStrokes(k).then(ps=>{
    if(!ps)return;
    document.querySelectorAll('#panel .blank.on').forEach(b=>{
      if(b.dataset.k!==k)return;
      b.classList.add('svg');
      b.innerHTML='<svg viewBox="0 0 109 109">'+ps.map(d=>'<path d="'+d+'"/>').join('')+'</svg>';
    });
  });
}
function drawStrokes(k){
  const box=$('kanim');if(!box)return;
  const my=++ANIM;
  box.innerHTML='';
  const cnt=$('kcount');if(cnt)cnt.textContent='';
  loadStrokes(k).then(ps=>{
    if(my!==ANIM||!box.isConnected)return;
    if(!ps){
      box.innerHTML=`<span>${k}</span>`;
      const rb=$('replay');if(rb)rb.style.visibility='hidden';
      return;
    }
    const NS='http://www.w3.org/2000/svg';
    const svg=document.createElementNS(NS,'svg');
    svg.setAttribute('viewBox','0 0 109 109');
    box.appendChild(svg);
    const els=ps.map(d=>{const p=document.createElementNS(NS,'path');p.setAttribute('d',d);svg.appendChild(p);return p});
    let t=0;
    els.forEach((p,i)=>{
      const L=p.getTotalLength()+1;
      p.style.strokeDasharray=L+' '+L;
      p.style.strokeDashoffset=L;
      const dur=Math.max(300,L*10);
      p.animate([{strokeDashoffset:L},{strokeDashoffset:0}],{duration:dur,delay:t,fill:'both',easing:'ease-in-out'});
      setTimeout(()=>{if(my===ANIM&&cnt)cnt.textContent=(i+1)+' / '+els.length+'画'},t);
      t+=dur+200;
    });
  });
}

function chk(label,idx){
  return `<label class="chk"><input type="checkbox" id="ok-${idx}" ${S.ok[idx]?'checked':''}><span class="sq">${CHECK_SVG}</span>${label}</label>`;
}

/* チェックボックス */
$('panel').addEventListener('change',e=>{
  if(e.target.type!=='checkbox')return;
  const idx=S.list[S.pos];
  S.ok[idx]=e.target.checked;
  setDone(S.mode,idx,e.target.checked);
  if(e.target.checked)pinpon();
});
/* 送りがなの選択 */
$('panel').addEventListener('click',e=>{
  const b=e.target.closest('.opt');
  if(!b||S.mode!=='okuri')return;
  const idx=S.list[S.pos],q=OKURI[idx];
  if(S.picked[idx]!==undefined)return;
  S.picked[idx]=b.dataset.o;
  S.ok[idx]=b.dataset.o===q.o[0];
  if(S.ok[idx])setDone(S.mode,idx,true);
  S.ok[idx]?pinpon():bubuu();
  render();
});
/* こたえを見る */
$('check').addEventListener('click',()=>{
  ac();
  const idx=S.list[S.pos];
  if(S.open[idx])return;
  S.open[idx]=true;
  render();
  if(S.mode==='read')speak(sayText(READ[idx]),READ[idx].vr);
});
$('prev').addEventListener('click',()=>{if(S.pos>0){S.pos--;render()}});
$('next').addEventListener('click',()=>{
  if(S.pos<S.list.length-1){S.pos++;render()}
  else finish();
});
$('toHome').addEventListener('click',()=>{try{speechSynthesis.cancel()}catch(e){}renderHome();show('home')});

/* ---------- 結果 ---------- */
function finish(){
  try{speechSynthesis.cancel()}catch(e){}
  const m=MODES[S.mode];
  const wrong=S.list.filter(i=>!S.ok[i]);
  const n=S.list.length,good=n-wrong.length;
  WRONG[S.mode]=wrong;saveWrong();
  if(!remaining(S.mode).length){congrats(S.mode);return}
  /* まだチェックがついていない問題を、そのままつづけて出す（ぜんぶチェックがついたら、おめでとう画面） */
  start(S.mode,null);return;
  $('result').style.setProperty('--mc',m.color);
  $('rMode').textContent=m.name+(S.retry?'（まちがえた問題）':'');
  $('rScore').innerHTML=`${good}<small> / ${n}</small>`;
  let msg;
  if(!wrong.length)msg='ぜんぶできた！すばらしい！';
  else if(good/n>=.8)msg='あと少し！まちがえた問題をやってみよう。';
  else msg='まちがえた問題を、もう一度れんしゅうしよう。';
  $('rMsg').textContent=msg;
  $('rMiss').innerHTML=wrong.map(i=>`<span>${esc(label(S.mode,i))}</span>`).join('');
  $('rRetry').hidden=!wrong.length;
  show('result');
  if(!wrong.length)party();
}
function label(mode,i){
  if(mode==='write')return WRITE[i].k;
  if(mode==='read')return READ[i].w;
  return OKURI[i].o[0];
}
$('rRetry').addEventListener('click',()=>start(S.mode,WRONG[S.mode]));
$('rAgain').addEventListener('click',()=>start(S.mode,null));
$('rHome').addEventListener('click',()=>{renderHome();show('home')});

/* ---------- おめでとう（そのモードの問題にぜんぶチェックがついた） ---------- */
let CMODE=null;
function congrats(mode){
  try{speechSynthesis.cancel()}catch(e){}
  CMODE=mode;
  const m=MODES[mode];
  $('congrats').style.setProperty('--mc',m.color);
  $('cMode').textContent=m.name;
  $('cMsg').textContent=`${m.data.length}問 ぜんぶクリア！よくがんばったね。`;
  show('congrats');
  party();
}
$('cHome').addEventListener('click',()=>{renderHome();show('home')});

/* ---------- リセット（確認してから、そのモードのチェックを消す） ---------- */
let DMODE=null;
function askReset(mode){
  DMODE=mode;
  const m=MODES[mode];
  $('dMsg').innerHTML=`「${esc(m.name)}」のチェックを<b>ぜんぶ消して</b>、${m.data.length}問にもどします。<br>消したチェックは、もとにもどせません。`;
  $('dlg').hidden=false;
  $('dCancel').focus();
}
function closeDlg(){$('dlg').hidden=true;DMODE=null}
$('reset').addEventListener('click',()=>{if(S)askReset(S.mode)});
$('cReset').addEventListener('click',()=>{if(CMODE)askReset(CMODE)});
$('dCancel').addEventListener('click',closeDlg);
$('dlg').addEventListener('click',e=>{if(e.target===$('dlg'))closeDlg()});
$('dOk').addEventListener('click',()=>{
  const mode=DMODE;closeDlg();
  if(!mode)return;
  DONE[mode]=[];saveDone();
  WRONG[mode]=[];saveWrong();
  start(mode,null);
});

/* キーボード（←→） */
document.addEventListener('keydown',e=>{
  if(!$('dlg').hidden){if(e.key==='Escape')closeDlg();return}
  if($('quiz').hidden)return;
  if(e.key==='ArrowRight')$('next').click();
  if(e.key==='ArrowLeft'&&!$('prev').disabled)$('prev').click();
});

renderHome();
</script>
</body>
</html>
